name: Refresh salary data

on:
  push:
    branches:
      - main
  schedule:
    # BACKSTOP ONLY — this is not what keeps the site fresh.
    #
    # GitHub does not honour a 5-minute schedule. Measured 2026-08-06/07, runs
    # from this cron actually landed every two to three HOURS, and twice failed
    # after 15 minutes with "The job was not acquired by Runner of type hosted":
    # high-frequency schedules get throttled and dropped. Every fast refresh in
    # the run history came from a push, so on a day with submissions but no
    # commits, new departments stayed invisible for hours.
    #
    # The real schedule now lives in workers/refresh-cron (a Cloudflare cron
    # trigger, which does fire on time) and reaches this workflow through the
    # workflow_dispatch trigger below. This entry is kept as a safety net for
    # when that Worker is down or not yet deployed.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: texas-fire-salaries-production
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    name: Refresh Firestore data and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the site
        uses: actions/checkout@v6

      - name: Use Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh community data
        run: npm run refresh

      - name: Run tests
        run: npm test

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=texas-fire-salaries --branch=main --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
