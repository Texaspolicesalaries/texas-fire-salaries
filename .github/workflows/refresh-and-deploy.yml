name: Refresh salary data

on:
  push:
    branches:
      - main
  schedule:
    # Every 5 minutes — GitHub's shortest allowed interval. The job takes about a
    # minute, so a contributor waits ~1-6 minutes for their submission to show up
    # on the site. GitHub delays scheduled runs under load, so treat this as a
    # floor, not a guarantee; js/submit.js's success message sets expectations to
    # match and should be updated alongside any change here.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: texas-fire-salaries-production
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    name: Refresh Firestore data and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the site
        uses: actions/checkout@v6

      - name: Use Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh community data
        run: npm run refresh

      - name: Run tests
        run: npm test

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=texas-fire-salaries --branch=main --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
