<head>
  <meta charset="utf-8">

  <link rel="icon" type="image/png" sizes="32x32" href="/assets/branding/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/branding/favicon-192.png">

  <style>
    .wiz-steps { display:flex; align-items:center; gap:.4rem; margin:0 0 1.5rem; flex-wrap:wrap; }
    .wiz-step { display:flex; align-items:center; gap:.4rem; color:var(--text-faint); font-size:var(--fs-sm); font-weight:600; }
    .wiz-step .dot { width:26px; height:26px; border-radius:50%; display:grid; place-items:center; background:var(--bg-inset); color:var(--text-soft); font-weight:700; font-size:.8rem; }
    .wiz-step.active { color:var(--text); }
    .wiz-step.active .dot { background:var(--accent); color:#fff; }
    .wiz-step.done .dot { background:var(--accent-2); color:#fff; }
    /* Completed steps render as <button> so they can be clicked (and tabbed) to
       navigate back; strip the UA button chrome so they still read as chips. */
    button.wiz-step { background:none; border:0; padding:0; font:inherit; cursor:pointer; }
    button.wiz-step:hover .lab { color:var(--text); text-decoration:underline; }
    button.wiz-step:focus-visible { outline:2px solid var(--accent); outline-offset:3px; border-radius:var(--r-sm); }
    .wiz-sep { flex:1; height:1px; background:var(--border); min-width:10px; max-width:36px; }
    @media (max-width:560px){ .wiz-step .lab{ display:none; } .wiz-sep{ max-width:none; } }
    .wiz-nav { display:flex; justify-content:space-between; align-items:center; gap:1rem; margin-top:1.5rem; }
    .seg { display:inline-flex; border:1px solid var(--border-strong); border-radius:var(--r-pill); overflow:hidden; margin-bottom:1.25rem; }
    .seg button { background:transparent; border:0; padding:.5rem 1.1rem; font-weight:650; font-size:var(--fs-sm); cursor:pointer; color:var(--text-soft); }
    .seg button.active { background:var(--accent); color:#fff; }
    @media (max-width:480px){ #mode-seg{ width:100%; } #mode-seg button{ flex:1; padding:.5rem .3rem; font-size:var(--fs-xs); line-height:1.25; } }
    .cv-card .cv-title { font-weight:700; font-size:var(--fs-sm); margin-bottom:.5rem; }
    .cv-row { display:flex; justify-content:space-between; padding:3px 0; font-size:var(--fs-sm); border-bottom:1px dashed var(--border); }
    .cv-row:last-of-type { border-bottom:0; }
    .cv-row span { color:var(--text-soft); }
    .review-card { border:1px solid var(--border); border-radius:var(--r-md); overflow:hidden; }
    .rv-row { display:grid; grid-template-columns:1fr auto auto auto; gap:.6rem; align-items:center; padding:.6rem .9rem; border-bottom:1px solid var(--border); font-size:var(--fs-sm); }
    .rv-row:last-child { border-bottom:0; }
    .rv-k { color:var(--text-soft); font-weight:600; }
    .rv-old { color:var(--text-faint); text-decoration:line-through; }
    .rv-arw { color:var(--text-faint); }
    .rv-new { font-weight:700; color:var(--text); }
    @media (max-width:560px){ .rv-row{ grid-template-columns:1fr auto; } .rv-old,.rv-arw{ display:none; } }
    .supp-row { display:grid; grid-template-columns:1.5fr 1fr .9fr auto; gap:.5rem; align-items:center; margin-bottom:.5rem; }
    @media (max-width:560px){ .supp-row{ grid-template-columns:1fr 1fr; } .supp-row .s-rm{ grid-column:2; justify-self:end; } }
    .step-card { border:1px solid var(--border); border-radius:var(--r-md); padding:1rem; margin-bottom:.75rem; background:var(--bg-raised); }
    .step-card .sc-head { display:flex; justify-content:space-between; align-items:center; font-weight:700; margin-bottom:.5rem; }
    .upload-area { display:flex; align-items:center; gap:.75rem; border:2px dashed var(--border-strong); border-radius:var(--r-md); padding:1.1rem; cursor:pointer; transition:border-color .15s, background .15s; }
    .upload-area:hover, .upload-area.is-dragover { border-color:var(--accent-2); background:var(--bg-sunken); }
    .upload-area.is-dragover { border-style:solid; }
    .upload-area .up-icon { font-size:1.6rem; }
    .upload-area .up-file { margin-left:auto; font-size:var(--fs-sm); color:var(--accent-2); font-weight:650; }
    /* Full step-plan editor */
    .plan-grid { border:1px solid var(--border); border-radius:var(--r-md); overflow:hidden; }
    .plan-head, .plan-row { display:grid; grid-template-columns:40px minmax(90px,1.4fr) 84px minmax(80px,1fr) minmax(80px,1fr) 120px; gap:.35rem; align-items:center; }
    .plan-head { background:var(--bg-sunken); padding:.45rem .55rem; font-size:var(--fs-xs); text-transform:uppercase; letter-spacing:.02em; color:var(--text-faint); font-weight:700; }
    .plan-row { padding:.45rem .55rem; border-top:1px solid var(--border); }
    .plan-row .cl { display:none; }
    .plan-head .hd-unit { display:block; font-weight:600; color:var(--accent-2); text-transform:none; letter-spacing:0; }
    .plan-grid input { padding:.4rem .45rem !important; }
    .plan-row .pc-top { display:flex; justify-content:center; }
    .plan-row .pc-top label { display:flex; align-items:center; gap:4px; margin:0; font-weight:500; cursor:pointer; }
    .plan-row .top-word { font-size:var(--fs-xs); color:var(--text-soft); }
    .pc-act { display:flex; gap:2px; justify-content:flex-end; }
    .ib { width:24px; height:28px; border:1px solid var(--border); background:var(--bg-raised); border-radius:6px; cursor:pointer; color:var(--text-soft); font-size:.8rem; line-height:1; padding:0; }
    .ib:hover { background:var(--bg-sunken); color:var(--text); }
    .ib:disabled { opacity:.35; cursor:default; }
    .ib-rm:hover { color:var(--f-outdated-fg); }
    .plan-controls { display:flex; flex-wrap:wrap; gap:.5rem; margin-top:.6rem; }
    #p-notes { min-height:70px; }
    .derived-card { margin-top:1rem; border:1px solid color-mix(in srgb, var(--accent-2) 30%, var(--border)); background:var(--accent-2-soft); border-radius:var(--r-md); padding:.75rem 1rem; }
    .derived-card .dv-title { font-size:var(--fs-xs); text-transform:uppercase; letter-spacing:.05em; color:var(--accent-2); font-weight:700; margin-bottom:.45rem; }
    .dv-grid { display:flex; flex-wrap:wrap; gap:1.25rem; }
    .dv { display:flex; flex-direction:column; }
    .dv-v { font-family:var(--font-display); font-size:1.2rem; font-weight:600; color:var(--text); line-height:1; }
    .dv-l { font-size:var(--fs-xs); color:var(--text-soft); margin-top:3px; }
    .rv-steps { margin-top:.75rem; border:1px solid var(--border); border-radius:var(--r-md); overflow:hidden; }
    .rv-steps-title { background:var(--bg-sunken); padding:.4rem .9rem; font-size:var(--fs-xs); text-transform:uppercase; letter-spacing:.04em; color:var(--text-soft); font-weight:700; }
    .rv-step { display:grid; grid-template-columns:1fr auto auto; gap:.75rem; padding:.4rem .9rem; border-top:1px solid var(--border); font-size:var(--fs-sm); }
    @media (max-width:640px){
      .plan-head { display:none; }
      .plan-row { display:block; padding:.75rem; border-top:6px solid var(--bg-inset); }
      .plan-row .pc { display:flex; align-items:center; gap:.5rem; margin-bottom:.45rem; }
      .plan-row .cl { display:block; flex:0 0 42%; font-size:var(--fs-sm); color:var(--text-soft); font-weight:600; }
      /* min-width:0 is load-bearing: a flex item's floor is its min-content
         width, which for a text input is its `size` attribute default (~20
         chars), not zero. Without it the input keeps that intrinsic width no
         matter how little room is left beside the 42% label, and overflows the
         card — measured 382px against a 351px card edge on a 375px screen,
         clipping whatever was typed. */
      .plan-row .pc input:not([type=radio]) { flex:1 1 0; min-width:0; width:auto; }
      .plan-row .pc-top { justify-content:flex-start; }
      .plan-row .top-word { display:none; }
      .pc-act { justify-content:flex-start; margin-top:.3rem; }
    }
  </style>
</head>

</body>
</html>
