<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactive Texas Fire Department Map | Texas Fire Salaries</title>
  <meta name="description" content="Find Texas fire departments on an interactive map, filter by pay, schedule, and data freshness, and compare community-reported firefighter salaries.">
  <link rel="canonical" href="https://texasfiresalaries.com/map.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="/css/tokens-20260729b.css">
  <link rel="stylesheet" href="/css/base-20260729b.css">
  <link rel="stylesheet" href="/css/components-20260729b.css">
  <link rel="stylesheet" href="/css/map-20260730d.css">
  <style>
    html, body { height: 100%; }
    .fire-cluster-wrap { background: none; border: none; }
    .fire-cluster { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
      background: color-mix(in srgb, var(--ember-600) 88%, transparent); color: #fff; font-weight: 700;
      border: 3px solid color-mix(in srgb, var(--teal-500) 70%, #fff); box-shadow: var(--shadow-md); }
    .leaflet-popup-content-wrapper { border-radius: var(--r-md); background: var(--bg-raised); color: var(--text); }
    .leaflet-popup-tip { background: var(--bg-raised); }
    .map-popup strong { font-family: var(--font-display); font-size: 1rem; }
  </style>
</head>
<body data-page="map" class="has-mobile-bar">
  <div id="site-header"></div>

  <main id="main">
    <div class="explorer show-map">
      <div class="map-pane">
        <div id="map"></div>
        <div class="map-search-area">
          <button class="btn btn-primary btn-sm" id="search-area" aria-pressed="false">⤢ Search this area</button>
        </div>
        <div class="map-legend" aria-label="Map legend">
          <div style="font-weight:700;margin-bottom:.3rem">Data condition</div>
          <div class="leg"><span class="swatch">●</span> Current community data</div>
          <div class="leg"><span class="swatch">▲</span> Strong agreement</div>
          <div class="leg"><span class="swatch">!</span> Possibly outdated</div>
          <div class="leg"><span class="swatch">◧</span> Conflicting</div>
          <div class="leg"><span class="swatch">◆</span> Department maintained</div>
          <div class="leg"><span class="swatch">○</span> Salary data needed</div>
        </div>
      </div>

      <aside class="list-pane" aria-label="Department results">
        <div class="list-pane-head">
          <button class="btn btn-outline btn-sm" id="open-filters">☰ Filters <span id="filter-count" class="faint" style="margin-left:.3rem"></span></button>
          <span class="result-count" id="result-count">Loading…</span>
          <div class="spacer" style="flex:1"></div>
        </div>
        <div class="list-pane-body" id="list-body"><p class="muted">Loading departments…</p></div>
      </aside>
    </div>
  </main>

  <!-- Filter drawer -->
  <div class="filter-drawer" id="filter-drawer" role="dialog" aria-label="Filters">
    <div class="filter-drawer-head">
      <h2 style="margin:0">Filters</h2>
      <button class="btn btn-ghost" id="close-filters" aria-label="Close filters">✕</button>
    </div>
    <div class="filter-drawer-body"><div id="filter-panel" class="filters"></div></div>
    <div class="filter-drawer-foot">
      <button class="btn btn-ghost" id="clear-filters">Clear all</button>
      <button class="btn btn-primary btn-block" id="close-filters-2" onclick="document.getElementById('filter-drawer').classList.remove('open')">Show results</button>
    </div>
  </div>

  <!-- Compare tray -->
  <div id="compare-tray" style="display:none;position:fixed;bottom:76px;left:50%;transform:translateX(-50%);z-index:80;background:var(--ink-900);color:#fff;border-radius:var(--r-pill);padding:.5rem 1rem;align-items:center;gap:.75rem;box-shadow:var(--shadow-lg)">
    <span><strong id="compare-tray-count">0</strong> selected</span>
    <a class="btn btn-primary btn-sm" href="/compare.html">Compare →</a>
  </div>

  <!-- Mobile map/list toggle -->
  <div class="mobile-bar">
    <button class="btn btn-outline" data-view="map">Map</button>
    <button class="btn btn-outline" data-view="list">List</button>
    <button class="btn btn-outline" id="open-filters-m" onclick="document.getElementById('filter-drawer').classList.add('open')">Filters</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="/js/salary-lib.js"></script>
  <script src="/js/consensus.js"></script>
  <script src="/js/derive.js"></script>
  <script src="/js/aggregate.js"></script>
  <script src="/js/firebase-init.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/data.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/compare-store.js"></script>
  <script src="/js/texas-zips-20260730.js"></script>
  <script src="/js/filters-20260730.js"></script>
  <script src="/js/filters-ui-20260730b.js"></script>
  <script src="/js/nav-20260729.js"></script>
  <script src="/js/map-20260730b.js"></script>
</body>
</html>
