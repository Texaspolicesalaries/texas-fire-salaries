<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactive Texas Fire Department Map | Texas Fire Salaries</title>
  <meta name="description" content="Find Texas fire departments on an interactive map, filter by pay, schedule, and data freshness, and compare community-reported firefighter salaries.">
  <link rel="canonical" href="https://texasfiresalaries.com/map">
  <meta property="og:title" content="Interactive Texas Fire Department Map | Texas Fire Salaries">
  <meta property="og:description" content="Find Texas fire departments on an interactive map, filter by pay, schedule, and data freshness, and compare community-reported firefighter salaries.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://texasfiresalaries.com/assets/branding/og-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/assets/branding/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/branding/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/branding/favicon-192.png">
  <link rel="apple-touch-icon" href="/assets/branding/favicon-180.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/vendor/fonts.css?v=0f4bbc1d">
  <link rel="stylesheet" href="/css/vendor/leaflet.css?v=ec929f11">
  <link rel="stylesheet" href="/css/vendor/markercluster.css?v=bcc4ce53">
  <link rel="stylesheet" href="/css/tokens-20260729b.css?v=6238e844">
  <link rel="stylesheet" href="/css/base-20260729b.css?v=a35e9b77">
  <link rel="stylesheet" href="/css/components-20260729b.css?v=0ee42495">
  <link rel="stylesheet" href="/css/map-20260730d.css?v=09376584">
  <style>
    html, body { height: 100%; }
    .fire-cluster-wrap { background: none; border: none; }
    .fire-cluster { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
      background: color-mix(in srgb, var(--ember-600) 88%, transparent); color: #fff; font-weight: 700;
      border: 3px solid color-mix(in srgb, var(--teal-500) 70%, #fff); box-shadow: var(--shadow-md); }
    .leaflet-popup-content-wrapper { border-radius: var(--r-md); background: var(--bg-raised); color: var(--text); }
    .leaflet-popup-tip { background: var(--bg-raised); }
    .map-popup strong { font-family: var(--font-display); font-size: 1rem; }
  </style>
</head>
<body data-page="map" class="has-mobile-bar">
  <div id="site-header"></div>

  <main id="main">
    <div class="explorer show-map">
      <div class="map-pane">
        <div id="map"></div>
        <details class="map-legend" id="map-legend" aria-label="Map legend" open>
          <summary>Data condition</summary>
          <div class="leg"><span class="swatch pin-current"><span>●</span></span> Current community data</div>
          <div class="leg"><span class="swatch pin-strong"><span>▲</span></span> Strong agreement</div>
          <div class="leg"><span class="swatch pin-outdated"><span>!</span></span> Possibly outdated</div>
          <div class="leg"><span class="swatch pin-conflict"><span>◧</span></span> Conflicting</div>
          <div class="leg"><span class="swatch pin-dept"><span>◆</span></span> Department maintained</div>
          <div class="leg"><span class="swatch pin-missing"><span>○</span></span> Salary data needed</div>
        </details>
      </div>

      <aside class="list-pane" aria-label="Department results">
        <div class="list-pane-head">
          <button class="btn btn-outline btn-sm" id="open-filters">☰ Filters <span id="filter-count" class="faint" style="margin-left:.3rem"></span></button>
          <span class="result-count" id="result-count">Loading…</span>
          <div class="spacer" style="flex:1"></div>
        </div>
        <div class="list-pane-body" id="list-body"><p class="muted">Loading departments…</p></div>
      </aside>
    </div>
  </main>

  <!-- Filter drawer -->
  <div class="filter-drawer" id="filter-drawer" role="dialog" aria-label="Filters">
    <div class="filter-drawer-head">
      <h2 style="margin:0">Filters</h2>
      <button class="btn btn-ghost" id="close-filters" aria-label="Close filters">✕</button>
    </div>
    <div class="filter-drawer-body"><div id="filter-panel" class="filters"></div></div>
    <div class="filter-drawer-foot">
      <button class="btn btn-ghost" id="clear-filters">Clear all</button>
      <button class="btn btn-primary btn-block" id="close-filters-2" onclick="document.getElementById('filter-drawer').classList.remove('open')">Show results</button>
    </div>
  </div>

  <!-- Compare tray -->
  <div id="compare-tray" class="compare-tray" style="display:none">
    <span><strong id="compare-tray-count">0</strong> selected</span>
    <a class="btn btn-primary btn-sm" href="/compare.html">Compare →</a>
    <button class="btn btn-ghost btn-sm" id="compare-clear" style="color:#fff" aria-label="Clear comparison" onclick="window.FireCompareStore&&window.FireCompareStore.clear();document.querySelectorAll('.add-compare').forEach(function(b){b.textContent='＋ Compare';})">Clear ✕</button>
  </div>

  <!-- Mobile map/list toggle -->
  <div class="mobile-bar">
    <button class="btn btn-outline" data-view="map">Map</button>
    <button class="btn btn-outline" data-view="list">List</button>
    <button class="btn btn-outline" id="open-filters-m" onclick="document.getElementById('filter-drawer').classList.add('open')">Filters</button>
  </div>

  <script src="/js/vendor/leaflet.js?v=5a640ff8"></script>
  <script src="/js/vendor/leaflet.markercluster.js?v=19805c0d"></script>
  <script src="/js/salary-lib.js?v=6bfd0f09"></script>
  <script src="/js/consensus.js?v=575b8554"></script>
  <script src="/js/derive.js?v=f1eb6a1e"></script>
  <script src="/js/aggregate.js?v=d4dfcfdd"></script>
  <script src="/js/firebase-init.js?v=efa5e943"></script>
  <script src="/js/analytics.js?v=7971dd8b"></script>
  <script src="/js/auth.js?v=a5d28356"></script>
  <script src="/js/data.js?v=22b65854"></script>
  <script src="/js/ui.js?v=9209fa74"></script>
  <script src="/js/compare-store.js?v=7abf36fd"></script>
  <script src="/js/texas-zips-20260730.js?v=d2372992"></script>
  <script src="/js/filters-20260730.js?v=dca1a096"></script>
  <script src="/js/filters-ui-20260730c.js?v=4eeb89b6"></script>
  <script src="/js/nav-20260729.js?v=7e5646ce"></script>
  <script src="/js/map-20260730d.js?v=a8f6f441"></script>
</body>
</html>
